<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Page</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #666666;
      --accent: #2255cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --text: #e8e8e8;
        --muted: #9aa0a6;
        --accent: #7aa2ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }
    header, main, footer {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    nav a {
      margin-right: 1rem;
      color: var(--accent);
      text-decoration: none;
    }
    nav a:hover, nav a:focus-visible { text-decoration: underline; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: var(--muted); }
    footer { font-size: 0.875rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="home">
      <h1>Hello, world</h1>
      <p>This is a basic starter page. Edit this text to get going.</p>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>Write something about yourself or your project here.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p><a href="mailto:you@example.com" style="color: var(--accent)">you@example.com</a></p>
    </section>
  </main>

  <footer>
    &copy; 2026 Your Name
  </footer>
</body>
</html>
